<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Penjual - TokoKu</title>
<style>
  body { font-family: 'Segoe UI', Arial; margin: 0; background: #f5f7fa; color: #333; }
  .header { background: #FF5722; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
  .header img { width: 40px; height: 40px; border-radius: 50%; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; padding: 20px 30px; }
  .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .card h4 { margin: 0; font-size: 14px; color: #777; }
  .card h2 { margin: 8px 0; font-size: 24px; }
  .main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 0 30px 20px; }
  .btn { background: #FF5722; color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .produk-list { display: flex; gap: 15px; }
  .produk-item { text-align: center; }
  .produk-item img { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; }
  .banner img { width: 100%; border-radius: 12px; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <h2>🏪 Warung Maju Jaya</h2>
  <div style="display:flex; gap:15px; align-items:center;">
    <span>🔔</span>
    <img src="https://i.pravatar.cc/40" alt="Profil Penjual">
  </div>
</div>

<!-- STATISTIK -->
<div class="stats">
  <div class="card">
    <h4>Penjualan Hari Ini</h4>
    <h2>Rp 2.450.000</h2>
    <span style="color:green;">↑ 12% dari kemarin</span>
  </div>
  <div class="card">
    <h4>Pesanan Baru</h4>
    <h2>18</h2>
    <button class="btn">Proses 5 Pesanan</button>
  </div
